<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Bydlo — jedna hodina s designérem</title>
<meta name="description" content="Krátká placená konzultace s architektem nebo interiérovým designérem. Pro lidi, kteří právě koupili byt, stěhují se nebo rekonstruují." />
<link rel="stylesheet" href="colors_and_type.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        bg: 'hsl(var(--background))',
        surface: 'hsl(var(--secondary))',
        'surface-2': 'hsl(var(--muted))',
        fg: 'hsl(var(--foreground))',
        'fg-muted': 'hsl(var(--muted-foreground))',
        'fg-subtle': 'hsl(var(--subtle))',
        primary: {
          DEFAULT: 'hsl(var(--primary))',
          foreground: 'hsl(var(--primary-foreground))',
          hover: 'hsl(13 52% 47%)',
        },
        border: {
          DEFAULT: 'hsl(var(--border))',
          strong: 'hsl(30 8% 80%)',
        },
      },
      boxShadow: {
        card: '0 1px 3px 0 rgb(0 0 0 / 0.04)',
        hover: '0 8px 24px 0 rgb(0 0 0 / 0.06)',
      },
      fontFamily: {
        sans: ['Plus Jakarta Sans', 'ui-sans-serif', 'system-ui', 'sans-serif'],
      },
      keyframes: {
        'fade-in': { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
        'slide-in-from-bottom-1': { '0%': { transform: 'translateY(4px)' }, '100%': { transform: 'translateY(0)' } },
      },
      animation: {
        'fade-in': 'fade-in 200ms ease-out',
      },
    }
  }
};
</script>
<style>
  body { font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif; }
  .animate-in { animation-duration: 200ms; animation-fill-mode: both; }
  .fade-in { animation-name: fade-in; }
  .slide-in-from-bottom-1 { animation-name: slide-in-from-bottom-1; }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slide-in-from-bottom-1 { from { transform: translateY(4px); } to { transform: translateY(0); } }
  .duration-200 { animation-duration: 200ms; }
  .duration-300 { animation-duration: 300ms; }
  html { scroll-behavior: smooth; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body class="bg-bg text-fg">
  <div id="root"></div>

  <!-- Google Apps Script Web App URL — viz README.md.
       Po nasazení nahraď '' za URL ve tvaru
       https://script.google.com/macros/s/AKfyc.../exec -->
  <script>
    window.BYDLO_FORM_URL = '';
  </script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="sections.jsx"></script>
  <script type="text/babel" src="sections2.jsx"></script>
  <script type="text/babel" src="email-modal.jsx"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "heroVariant": "consult",
      "priceTier": "normal",
      "showStickyBanner": true
    }/*EDITMODE-END*/;

    function App() {
      const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
      const [modalOpen, setModalOpen] = useState(false);
      const [prefill, setPrefill] = useState('');

      // Track page visit (for fake-door measurement)
      useEffect(() => {
        try {
          const n = parseInt(localStorage.getItem('bydlo_visits') || '0', 10) + 1;
          localStorage.setItem('bydlo_visits', String(n));
        } catch (e) {}
      }, []);

      const openModal = (text) => {
        setPrefill(text || '');
        setModalOpen(true);
      };

      return (
        <div data-screen-label="Fake door landing" className="min-h-screen bg-bg">
          <FDHeader onCta={() => openModal('')} />
          <FDHero
            tweaks={tweaks}
            onCta={() => openModal('')}
            onSubmitText={(t) => openModal(t)}
          />
          <FDHowItWorks />
          <FDOutput />
          <FDSituations onCta={() => openModal('')} />
          <FDDesigners onCta={() => openModal('')} />
          <FDPricing tweaks={tweaks} onCta={() => openModal('')} />
          <FDReviews />
          <FDFaq />
          <FDFinalCTA onCta={() => openModal('')} />
          <FDFooter />

          <FDEmailModal
            open={modalOpen}
            onClose={() => setModalOpen(false)}
            prefill={prefill}
          />

          {/* Sticky bottom bar — appears after scroll */}
          {tweaks.showStickyBanner && <StickyBar onCta={() => openModal('')} />}

          <TweaksPanel title="Tweaks">
            <TweakSection title="Hero copy (A/B)">
              <TweakRadio
                label="Hlavní hook"
                value={tweaks.heroVariant}
                onChange={(v) => setTweak('heroVariant', v)}
                options={[
                  { value: 'consult',  label: 'Hodina, jedna konkrétní věc' },
                  { value: 'plan',     label: 'Než utratíš za nábytek' },
                  { value: 'decide',   label: 'Nevíš, jestli zbourat?' },
                  { value: 'decision', label: 'Jedno rozhodnutí, které vrtá' },
                ]}
              />
            </TweakSection>
            <TweakSection title="Cenová hladina">
              <TweakRadio
                label="Tier"
                value={tweaks.priceTier}
                onChange={(v) => setTweak('priceTier', v)}
                options={[
                  { value: 'cheap',  label: 'Levně' },
                  { value: 'normal', label: 'Standard' },
                  { value: 'rich',   label: 'Premium' },
                ]}
              />
            </TweakSection>
            <TweakSection title="Sticky CTA">
              <TweakToggle
                label="Lišta dole"
                value={tweaks.showStickyBanner}
                onChange={(v) => setTweak('showStickyBanner', v)}
              />
            </TweakSection>
            <TweakSection title="Měření (localStorage)">
              <FunnelStats />
            </TweakSection>
          </TweaksPanel>
        </div>
      );
    }

    function StickyBar({ onCta }) {
      const [show, setShow] = useState(false);
      useEffect(() => {
        const onScroll = () => setShow(window.scrollY > 800);
        window.addEventListener('scroll', onScroll, { passive: true });
        onScroll();
        return () => window.removeEventListener('scroll', onScroll);
      }, []);
      if (!show) return null;
      return (
        <div className="fixed bottom-4 left-1/2 -translate-x-1/2 z-30 animate-in fade-in slide-in-from-bottom-1 duration-300">
          <div className="flex items-center gap-3 bg-fg text-bg pl-5 pr-2 py-2 rounded-full shadow-[0_8px_24px_0_rgb(0_0_0/0.18)]">
            <span className="text-sm font-medium hidden sm:inline">Připraven začít?</span>
            <span className="text-xs text-bg/70 hidden md:inline">15 min · zdarma</span>
            <button
              onClick={onCta}
              className="inline-flex items-center gap-1.5 h-9 px-4 rounded-full bg-primary text-primary-foreground text-sm font-medium hover:bg-primary-hover transition-colors"
            >
              Vyzkoušet
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
            </button>
          </div>
        </div>
      );
    }

    function FunnelStats() {
      const [stats, setStats] = useState({ visits: 0, opens: 0, signups: 0 });
      useEffect(() => {
        const tick = () => {
          try {
            const visits = parseInt(localStorage.getItem('bydlo_visits') || '0', 10);
            const opens = parseInt(localStorage.getItem('bydlo_modal_opens') || '0', 10);
            const list = JSON.parse(localStorage.getItem('bydlo_signups') || '[]');
            setStats({ visits, opens, signups: list.length });
          } catch (e) {}
        };
        tick();
        const id = setInterval(tick, 1000);
        return () => clearInterval(id);
      }, []);
      const reset = () => {
        ['bydlo_visits', 'bydlo_modal_opens', 'bydlo_signups'].forEach(k => localStorage.removeItem(k));
        setStats({ visits: 0, opens: 0, signups: 0 });
      };
      const conv = stats.visits > 0 ? ((stats.signups / stats.visits) * 100).toFixed(1) : '0.0';
      return (
        <div>
          <div className="grid grid-cols-3 gap-2 text-center">
            <div className="rounded-md bg-white/5 border border-white/10 p-2">
              <div className="text-[10px] uppercase tracking-wider opacity-60">Návštěvy</div>
              <div className="text-lg font-bold mt-0.5">{stats.visits}</div>
            </div>
            <div className="rounded-md bg-white/5 border border-white/10 p-2">
              <div className="text-[10px] uppercase tracking-wider opacity-60">Otevření</div>
              <div className="text-lg font-bold mt-0.5">{stats.opens}</div>
            </div>
            <div className="rounded-md bg-white/5 border border-white/10 p-2">
              <div className="text-[10px] uppercase tracking-wider opacity-60">E-maily</div>
              <div className="text-lg font-bold mt-0.5">{stats.signups}</div>
            </div>
          </div>
          <div className="mt-2 text-xs text-center opacity-70">Konverze: {conv}%</div>
          <button onClick={reset} className="mt-2 w-full text-xs underline opacity-70 hover:opacity-100">Reset měření</button>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
